name: Build and run tests on Linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Installs the apt packages, builds SDL3 and GameNetworkingSockets from
      # source (Ubuntu 24.04 packages neither), configures with the toolkit,
      # launcher and other upstream tools off, builds the tests and runs them.
      # The tests use synthetic data only: no game files, display or network.
      - name: Build and run the unit tests
        shell: bash
        run: tools/cloud/linux_test.sh
