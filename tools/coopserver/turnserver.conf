# coturn for the kotor-coop relay fallback (docker-compose.yml passes the
# secret, realm and external IP on the command line).
listening-port=3478
# Relay addresses come from this range; open it in the firewall (UDP).
min-port=49160
max-port=49200
fingerprint
# Short-lived credentials minted by the signalling service (TURN REST API).
use-auth-secret
# Only UDP relaying; nothing is kept on disk.
no-tcp-relay
no-cli
no-tls
no-dtls
no-multicast-peers
# Keep the relay from reaching this machine's private networks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Cloud VM behind 1:1 NAT (EXTERNAL_IP=public/private): two players who are
# both relayed talk through this machine's own private address.
#allowed-peer-ip=10.0.0.5
# Quotas: a co-op session is 2-8 players; a relayed player uses about
# 5-25 KB/s (150-780 bytes a tick at 30 Hz).
user-quota=8
total-quota=40
# coturn reserves max-bps for every allocation against bps-capacity: the
# pair bounds how many allocations fit at once (here 1000000 / 64000 = 15).
# Each engine takes at least one, and an engine that dies leaves its
# allocations reserved until their lifetime ends (10 minutes). With
# max-bps=200000 only 5 fitted and relayed joins timed out.
max-bps=64000
bps-capacity=1000000
stale-nonce=600
# GameNetworkingSockets never refreshes a TURN permission (RFC default 300 s),
# so relayed games would drop after five minutes without this.
permission-lifetime=3600
log-file=stdout
simple-log
